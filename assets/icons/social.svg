<svg xmlns="http://www.w3.org/2000/svg">
<!--
	Suitemart social marks — HAND-AUTHORED, not generated.

	tools/build-sprite.mjs copies these symbols verbatim into sprite.svg after
	the Lucide set, so this is the one icon file that survives a rebuild. Edit
	it directly and run `npm run build:icons`.

	Why they live here rather than in Lucide: Lucide removed brand marks
	upstream, and the sprite is generated from it.

	These are deliberately simplified, single-path glyphs drawn on the same
	24x24 grid as the Lucide set so they sit correctly beside it. They are
	recognisable references to each service for the purpose of labelling a
	share link — nominative use — and are not reproductions of the official
	logos. Do not present them as the brands' own artwork, and do not restyle
	them to imitate official brand colours in marketing material.

	Filled shapes, unlike the Lucide strokes: `.sm-icon--social` in
	global.scss switches fill/stroke for these.
-->

