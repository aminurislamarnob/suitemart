name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - run: npm ci
      - run: composer install --no-interaction --no-progress

      - name: Build
        run: npm run build

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint styles
        run: npm run lint:css

      - name: Lint PHP
        run: vendor/bin/phpcs

      - name: Analyse PHP
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Check theme.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('theme.json','utf8'))"

      # The sprite is committed so a checkout without node_modules still renders
      # icons, which means it can drift from the icon list. This catches that.
      - name: Check the icon sprite is up to date
        run: npm run lint:icons

  test:
    name: Tests (WP ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    needs: static
    # The default is six hours. This suite takes minutes; anything approaching
    # this is hung, not slow.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Suitemart's floor and the bleeding edge. Testing against nightly is how
        # platform breakage is found before buyers hit it.
        wordpress: [ 'latest', 'nightly' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Start WordPress
        env:
          # The stable leg installs the release zip rather than letting wp-env
          # resolve a version and clone that git tag. The tag is published some
          # hours after the release the API already reports as latest, and in
          # that window `core: null` fails with "couldn't find remote ref
          # 7.0.4" — a red build caused by nothing in this repository, which
          # cost one investigation already. The zip is also what a real
          # installation gets.
          WP_ENV_CORE: ${{ matrix.wordpress == 'nightly' && 'WordPress/WordPress#master' || 'https://wordpress.org/latest.zip' }}
        run: npx wp-env start --update

      - name: Install Composer dependencies inside the container
        run: npx wp-env run tests-cli --env-cwd=wp-content/themes/suitemart composer install --no-interaction

      - name: PHPUnit
        run: npx wp-env run tests-cli --env-cwd=wp-content/themes/suitemart vendor/bin/phpunit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.wordpress }}
          path: playwright-report/
          retention-days: 7
